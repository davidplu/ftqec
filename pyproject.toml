[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ftqec"
version = "0.1.0"
description = "Population-based stabilizer syndrome-extraction research"
requires-python = ">=3.11"
dependencies = ["stim>=1.16", "psutil>=5"]
[project.optional-dependencies]
matching = ["pymatching>=2.3,<3"]
dev = ["pytest>=8", "ruff", "mypy"]
[project.scripts]
ftqec = "ftqec.cli.main:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
